name: Daily Auto Post Shorts to YouTube

on:
  schedule:
    # 第1回: 毎日 日本時間(JST) 午前09:00 = 協定世界時(UTC) 午前00:00
    - cron: '0 0 * * *'
    # 第2回: 毎日 日本時間(JST) 午後12:30 = 協定世界時(UTC) 午前03:30
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      theme_id:
        description: 'Specify theme_id manually (optional, e.g. theme_3_2)'
        required: false
        default: ''

# 同時実行防止（二重実行によるテーマ重複・重複投稿を遮断）
concurrency:
  group: production-auto-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  auto-post-shorts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg and Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download video material from Pexels
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python pexels_download.py

      - name: Convert video to 9:16 Shorts format
        run: |
          python shorts_convert.py

      - name: Generate Shorts with narration, subtitle and BGM
        env:
          THEME_ID: ${{ github.event.inputs.theme_id || env.THEME_ID }}
          INPUT_VIDEO: test_output/shorts_test.mp4
          OUTPUT_VIDEO: test_output/shorts_final.mp4
        run: |
          python generate_shorts_pipeline.py

      - name: Upload Shorts to YouTube as Unlisted
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: unlisted
          VIDEO_PATH: test_output/shorts_final.mp4
        run: |
          echo "Uploading as Unlisted (限定公開)..."
          if [ -f test_output/current_theme.json ]; then
            export YOUTUBE_VIDEO_TITLE=$(python -c "import json; print(json.load(open('test_output/current_theme.json'))['title'])")
            export YOUTUBE_VIDEO_DESCRIPTION=$(python -c "import json; t=json.load(open('test_output/current_theme.json')); print(f\"{t['title']}\n\n{t['narration']}\n\n#西田医院 #リハビリ #介護 #医療 #Shorts\")")
          else
            export YOUTUBE_VIDEO_TITLE="医療法人 西田医院 #Shorts"
            export YOUTUBE_VIDEO_DESCRIPTION="医療法人 西田医院公式 YouTube Shorts\n\n#西田医院 #リハビリ #介護 #医療 #Shorts"
          fi
          python youtube_upload.py

      - name: Commit and push updated theme state
        if: success()
        run: |
          # 投稿成功時のみテーマ状態を確定保存
          python -c "import json, os; from themes import commit_theme_state, select_next_theme; theme = json.load(open('test_output/current_theme.json')) if os.path.exists('test_output/current_theme.json') else select_next_theme(); commit_theme_state(theme)"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state/theme_state.json
          if git diff --staged --quiet; then
            echo "No theme state changes to commit."
          else
            git commit -m "Update theme state after successful unlisted post [skip ci]"
            git push origin main
          fi
