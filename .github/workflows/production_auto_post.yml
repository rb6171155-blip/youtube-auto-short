name: Daily Auto Post Shorts to YouTube

on:
  schedule:
    # 毎日 日本時間(JST) 午前09:00 = 協定世界時(UTC) 午前00:00 に自動実行
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  auto-post-shorts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download video material from Pexels
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python pexels_download.py

      - name: Convert video to 9:16 Shorts format
        run: |
          python shorts_convert.py

      - name: Upload scheduled Shorts to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_VIDEO_TITLE: "Daily Relaxation Aquarium Moments #Shorts"
          YOUTUBE_VIDEO_DESCRIPTION: "Daily relaxing aquarium and ocean moments. Subscribe for more daily relaxation! #Shorts"
        run: |
          # 実行日時の24時間後（安全な未来日時）をUTCのISO 8601形式で設定
          export YOUTUBE_PUBLISH_AT=$(date -u -d "+1 day" +"%Y-%m-%dT%H:%M:%SZ")
          echo "Calculated scheduled publishAt: $YOUTUBE_PUBLISH_AT"
          python youtube_upload.py
