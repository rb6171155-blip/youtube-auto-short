name: Test YouTube OAuth Authentication

on:
  workflow_dispatch:

jobs:
  test-auth:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-auth requests

      - name: Verify OAuth Authentication
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - << 'EOF'
          import os
          import sys
          import requests

          client_id = os.environ.get('YOUTUBE_CLIENT_ID')
          client_secret = os.environ.get('YOUTUBE_CLIENT_SECRET')
          refresh_token = os.environ.get('YOUTUBE_REFRESH_TOKEN')

          if not client_id or not client_secret or not refresh_token:
              print('Error: Missing required secrets in environment variables.', file=sys.stderr)
              sys.exit(1)

          try:
              data = {
                  'client_id': client_id,
                  'client_secret': client_secret,
                  'refresh_token': refresh_token,
                  'grant_type': 'refresh_token'
              }
              resp = requests.post('https://oauth2.googleapis.com/token', data=data)
              if resp.status_code == 200 and 'access_token' in resp.json():
                  print('OAuth authentication: SUCCESS')
              else:
                  print(f'OAuth authentication: FAILED (HTTP {resp.status_code})', file=sys.stderr)
                  sys.exit(1)
          except Exception as e:
              print(f'OAuth authentication: FAILED ({type(e).__name__})', file=sys.stderr)
              sys.exit(1)
          EOF