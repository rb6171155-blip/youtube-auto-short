name: Test Scheduled Shorts Upload

on:
  workflow_dispatch:

jobs:
  test-scheduled-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download test video from Pexels
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python pexels_download.py

      - name: Convert video to 9:16 Shorts format
        run: |
          python shorts_convert.py

      - name: Upload scheduled Shorts video to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          # 実行日時の24時間後（明日）をUTCのISO 8601形式で設定
          export YOUTUBE_PUBLISH_AT=$(date -u -d "+1 day" +"%Y-%m-%dT%H:%M:%SZ")
          echo "Scheduled publishAt timestamp: $YOUTUBE_PUBLISH_AT"
          python youtube_upload.py
